<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renewable Energy Usage Tracker</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background: var(--bg-app);">
  <div style="text-align: center;">
    <div style="width: 48px; height: 48px; border: 4px solid var(--primary-200); border-top-color: var(--primary-600); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem;"></div>
    <h3 style="color: var(--text-main); font-family: var(--font-heading);">Loading Renewable Energy Usage Tracker...</h3>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function initRedirect() {
      const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token');
      if (token) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
